name: Build ESPHome Firmware
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esphome/build-action@main
        id: esphome-build
        continue-on-error: true
        with:
          yaml-file: duc-moc-gateway.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            ${{ steps.esphome-build.outputs.name }}
            .esphome/build/duc-moc-gateway/**.bin
