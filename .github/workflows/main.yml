name: Build ESPHome Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Lấy thẳng bản main mới nhất của nhà phát hành, không bao giờ dính lỗi cache
      - uses: esphome/build-action@main
        id: esphome-build
        with:
          yaml_file: duc-moc-gateway.yaml
          
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: ${{ steps.esphome-build.outputs.name }}
