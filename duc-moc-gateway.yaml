esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram: # Kích hoạt 32MB RAM

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  id: wifi_w
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"

# --- MÀN HÌNH (GPIO 1 & 2) ---
i2c:
  sda: GPIO1
  scl: GPIO2
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_roboto
    size: 14

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(font_roboto), "Duc Moc Gateway");
      if (id(wifi_w).is_connected()) {
        it.print(0, 20, id(font_roboto), "WiFi: OK");
      }
      // Hiển thị trạng thái AI khi đang nghe
      if (id(va).is_running()) {
         it.print(0, 45, id(font_roboto), "AI: Dang nghe...");
      } else {
         it.print(0, 45, id(font_roboto), "AI: San sang");
      }

# --- ÂM THANH I2S (GPIO 3, 4, 5, 6) ---
i2s_audio:
  - i2s_lrclk_pin: GPIO3 
    i2s_bclk_pin: GPIO4  

microphone:
  - platform: i2s_audio
    id: ai_mic
    i2s_din_pin: GPIO5
    adc_type: external
    pdm: false

speaker:
  - platform: i2s_audio
    id: ai_speaker
    i2s_dout_pin: GPIO6
    dac_type: external

# --- KÍCH HOẠT VOICE ASSISTANT (TRỢ LÝ ẢO) ---
voice_assistant:
  id: va
  microphone: ai_mic
  speaker: ai_speaker
  use_wake_word: true # Cho phép gọi "Hey Jarvis" hoặc từ khóa tự chọn

# --- BLUETOOTH & UPDATE C6 (MÓN HỜI CỦA BÁC) ---
bluetooth_proxy:
  active: true

# Đoạn này sẽ giúp update con C6 để chạy song song WiFi+BT
# Bác chỉ bỏ dấu # khi đã upload file .bin lên GitHub nhé
update:
  platform: esp32_hosted
  name: "C6 Coprocessor Update"
  path: network_adapter.bin 

api:
ota:
  - platform: esphome
