esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard  # Tên định danh chuẩn 100% của hãng Waveshare
  variant: esp32p4
  flash_size: 16MB         # Mở khóa toàn bộ 16MB bộ nhớ của mạch
  framework:
    type: esp-idf

# Cầu nối SDIO ép con C6 phát WiFi cho P4
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO43
  cmd_pin: GPIO44
  d0_pin: GPIO39
  d1_pin: GPIO40
  d2_pin: GPIO41
  d3_pin: GPIO42

