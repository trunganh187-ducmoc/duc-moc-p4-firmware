esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB # Khai báo lớp ngoài 16MB Flash
  framework:
    type: esp-idf
    # Ép máy chủ nhận diện chuẩn 32MB PSRAM và 16MB Flash từ tận lõi hệ điều hành
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# Lệnh này bắt buộc phải có để ESPHome xuất đủ 32MB RAM ra cho anh dùng
psram:

# Cầu nối WiFi (Đã chuẩn 100%)
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO43
  cmd_pin: GPIO44
  d0_pin: GPIO39
  d1_pin: GPIO40
  d2_pin: GPIO41
  d3_pin: GPIO42

# 2 WiFi xưởng Đức Mộc
wifi:
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"
  ap:
    ssid: "Duc Moc Gateway Fallback"

# Xóa lỗi cảnh báo vàng
