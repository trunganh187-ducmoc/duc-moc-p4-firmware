esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# Đánh thức "Quái vật" 32MB RAM
psram:

# Thông nòng Log ra cổng USB ở giữa
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Cầu nối WiFi chuẩn Waveshare (Đã thêm lại active_high)
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO43
  cmd_pin: GPIO44
  d0_pin: GPIO39
  d1_pin: GPIO40
  d2_pin: GPIO41
  d3_pin: GPIO42

wifi:
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"
  ap:
    ssid: "Duc Moc Gateway Fallback"

captive_portal:
api:
ota:
  - platform: esphome
