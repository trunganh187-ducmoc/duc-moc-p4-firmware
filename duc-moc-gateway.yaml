esphome:
  name: duc-moc-gateway

esp32:
  board: esp32p4  # Mật danh chuẩn 100% để qua mặt cả 2 lớp bảo vệ
  variant: esp32p4
  framework:
    type: esp-idf

# Cầu nối WiFi SDIO 6 chân chuẩn xác cho P4 và C6
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO43
  cmd_pin: GPIO44
  d0_pin: GPIO39
  d1_pin: GPIO40
  d2_pin: GPIO41
  d3_pin: GPIO42

# Danh sách WiFi xưởng Đức Mộc (Tự động chuyển mạng)
wifi:
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"
  ap:
    ssid: "Duc Moc Gateway Fallback"

api:
ota:
