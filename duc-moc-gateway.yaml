# --- KHAI BÁO BIẾN TOÀN CẦU ĐỂ HIỆN CHỮ LÊN MÀN HÌNH ---
globals:
  - id: ai_status
    type: std::string
    initial_value: '"San sang"'
  - id: ai_answer
    type: std::string
    initial_value: '""'

esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# Kích hoạt "Full lực" 32MB PSRAM cho P4
psram:

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Cầu nối gọi C6 gánh WiFi + Bluetooth qua SDIO
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  id: wifi_w
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"

# --- MẮT: MÀN HÌNH OLED SSD1306 ---
i2c:
  sda: GPIO1
  scl: GPIO2
  scan: true

font:
  - file: "gfonts://Roboto"
    id: font_roboto
    size: 12 # Để font nhỏ một chút cho hiện được nhiều chữ

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.print(0, 0, id(font_roboto), "DUC MOC GATEWAY");
      
      // Hiện trạng thái WiFi và AI
      if (id(wifi_w).is_connected()) {
        it.print(100, 0, id(font_roboto), "WiFi");
      }
      
      it.print(0, 15, id(font_roboto), id(ai_status).c_str());
      
      // Hiển thị nội dung câu trả lời của AI
      // Tự động xuống dòng cơ bản
      it.printf(0, 32, id(font_roboto), "%.25s", id(ai_answer).substr(0, 25).c_str());
      it.printf(0, 48, id(font_roboto), "%.25s", id(ai_answer).length() > 25 ? id(ai_answer).substr(25, 25).c_str() : "");

# --- TAI & MỒM: ÂM THANH I2S ---
i2s_audio:
  - i2s_lrclk_pin: GPIO3 
    i2s_bclk_pin: GPIO4  

microphone:
  - platform: i2s_audio
    id: ai_mic
    i2s_din_pin: GPIO5
    adc_type: external
    pdm: false

speaker:
  - platform: i2s_audio
    id: ai_speaker
    i2s_dout_pin: GPIO6
    dac_type: external

# --- TRỢ LÝ ẢO: VOICE ASSISTANT CÓ HIỂN THỊ CHỮ ---
voice_assistant:
  id: va
  microphone: ai_mic
  speaker: ai_speaker
  use_wake_word: true
  on_listening:
    - lambda: 'id(ai_status) = "Dang nghe..."; id(ai_answer) = "";'
  on_stt_end: # ĐÃ VÁ LỖI: Dùng on_stt_end để nhận chữ bác nói
    - lambda: 'id(ai_answer) = x;'
  on_tts_start: # Nhận chữ AI chuẩn bị trả lời
    - lambda: 'id(ai_status) = "AI tra loi:"; id(ai_answer) = x;'
  on_end:
    - delay: 10s # Giữ chữ trên màn hình 10 giây
    - lambda: 'id(ai_status) = "San sang"; id(ai_answer) = "";'
# --- BLUETOOTH PROXY ---
bluetooth_proxy:
  active: true

# --- CẬP NHẬT CON C6 (VÁ LỖI 100% VỚI SHA256 CỦA BÁC) ---
update:
  - platform: esp32_hosted
    name: "C6 Coprocessor Update"
    type: binary # Bắt buộc phải có type: binary để không bị lỗi build
    path: network_adapter_esp32c6.bin
    sha256: "2aa46dbcd18f5b2046f58b82cdc62bdf21af137930e67c4b3b114f6e3e0daf15"

api:
ota:
  - platform: esphome
