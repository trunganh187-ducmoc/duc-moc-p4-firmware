esphome:
  name: duc-moc-gateway

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

# 1. Đánh thức 32MB RAM
psram:

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# 2. Cầu nối WiFi chuẩn Guition (Gọi C6 dậy)
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

wifi:
  networks:
    - ssid: "......VUPHONG....."
      password: "0913718786@bc.."
    - ssid: "TrungAnh_2.4G"
      password: "0913718786"
  ap:
    ssid: "Duc Moc Gateway Fallback"

# 3. Kích hoạt Bluetooth (Biến mạch thành Trạm Radar quét thiết bị Bluetooth quanh xưởng)
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 3

# 4. Kích hoạt Cổng mạng dây RJ45 (Chạy chip IP101 cực xịn)
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

captive_portal:
api:
ota:
  - platform: esphome
